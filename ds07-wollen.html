<style>
/* eingebettet: tokens.css */
/* Designsystem »Gegenwart« – Tokens (Stand 27.10.2026), für den Block Motivation im Psycho-Labor.
   Schriften liegen lokal in assets/fonts/. Themes: hell (Standard), dunkel, beamer über html[data-theme]. */
@font-face{font-family:"Bricolage Grotesque";src:url("assets/fonts/BricolageGrotesque96pt-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url("assets/fonts/BricolageGrotesque-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Fraunces";src:url("assets/fonts/Fraunces72pt-SemiBoldItalic.woff") format("woff");font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible Next";src:url("assets/fonts/AtkinsonHyperlegibleNext-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible Next";src:url("assets/fonts/AtkinsonHyperlegibleNext-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --grund:#f3efe7;--flaeche:#faf8f3;--karton:#e9e2d7;--text:#2a2622;--leise:#625a52;--stahl:#7d7364;--linie:#e4dccf;
  --honigplatte:#f2b233;--honig:#a26a1c;--auf-honig:#2a2622;--honig-hi:#f5e8cf;
  --petrol:#1e6b67;--auf-petrol:#fffdf9;--petrol-hi:#dbeae6;--ueberdruck:#1c4b15;--auf-ueberdruck:#fffdf9;
  --oxid:#9b402d;--oxid-hi:#f3dfd8;--kuli:#1e4fb5;--marker:#f3d54e;
  --erfolg:#2e6b34;--erfolg-hi:#dcebdc;--warnung:#8a5300;--warnung-hi:#f5e8cf;--fehler:#b0281c;--fehler-hi:#f6dcd8;
  --font-display:"Bricolage Grotesque",system-ui,sans-serif;--font-stimme:"Fraunces",Georgia,serif;--font-text:"Atkinson Hyperlegible Next",system-ui,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;
  --radius-none:0;--radius-sm:4px;--radius-md:10px;--radius-pill:999px;
  --platte:6px 6px 0 0 var(--platte-farbe,var(--karton));--platte-knopf:4px 4px 0 0 var(--linie);--fokus-innen:0 0 0 2px #fffdf9;
  --dauer-druck:100ms;--dauer-schnell:160ms;--dauer-mittel:220ms;--dauer-langsam:300ms;--dauer-aus:150ms;--dauer-aufdecken:420ms;--dauer-wende:460ms;--dauer-reihe:440ms;--dauer-registrieren:280ms;--dauer-staffel:30ms;
  --kurve-aus:cubic-bezier(0.23,1,0.32,1);--kurve-beidseits:cubic-bezier(0.77,0,0.175,1);--kurve-register:cubic-bezier(0.22,1,0.36,1);--kurve-feder:linear(0,0.5 14%,1.06 32%,0.98 52%,1.01 72%,1);
  --inhalt:72rem;--zeilenlaenge:68ch;--knopf-hoehe:48px;--tablet-ziel:56px;--chip-hoehe:44px;
}
:root[data-theme="dunkel"]{
  --grund:#181715;--flaeche:#22201d;--karton:#2d2a26;--text:#f3eadb;--leise:#b8ad9e;--stahl:#8f8576;--linie:#3a3631;
  --honig:#f2b233;--honig-hi:#3a2a10;--petrol:#5cc3c0;--auf-petrol:#12100d;--petrol-hi:#17322f;--ueberdruck:#2f6b3a;--auf-ueberdruck:#f3eadb;
  --oxid:#db826c;--oxid-hi:#3a221c;--kuli:#8fb0f0;--marker:#6b5a10;
  --erfolg:#7cc488;--erfolg-hi:#1d3320;--warnung:#e0a34a;--warnung-hi:#3a2a10;--fehler:#f08a7e;--fehler-hi:#3d1c18;--fokus-innen:0 0 0 2px #181715;
}
:root[data-theme="beamer"]{
  --grund:#ffffff;--flaeche:#f6f3ee;--karton:#ece7de;--text:#000000;--leise:#3a342e;--stahl:#4a433b;--linie:#c9c1b4;
  --honig:#7a4f12;--auf-honig:#000000;--petrol:#0f4f4b;--auf-petrol:#ffffff;--ueberdruck:#13380e;--auf-ueberdruck:#ffffff;
  --oxid:#7a2e1f;--kuli:#163c8c;--erfolg:#1f4f24;--warnung:#6b4000;--fehler:#8a1e14;--platte-knopf:4px 4px 0 0 #4a433b;--fokus-innen:0 0 0 2px #ffffff;
}
@media print{:root{--grund:#fff;--flaeche:#fff;--karton:#eee;--text:#000;--leise:#333;--stahl:#555;--linie:#bbb}}

</style>
<style>
/* eingebettet: bundle.css */
/* Gegenwart – Komponenten. Werte kommen aus tokens.css (var(--…)); Klassen-Präfix g-.
   Ruhezustand = Endzustand: ohne JavaScript, im Druck und bei weniger Bewegung ist alles lesbar. */

.g{background:var(--grund);color:var(--text);font:400 1.125rem/1.55 var(--font-text);-webkit-tap-highlight-color:transparent}
.g *,.g *::before,.g *::after{box-sizing:border-box}
.g [hidden]{display:none!important}
.g :where(h1,h2,h3){font-family:var(--font-display);margin:0;text-wrap:balance}
.g :where(p){margin:0;text-wrap:pretty}
.g-reihe{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.g-stapel{display:grid;gap:var(--space-4)}
.g-meta{font-size:1rem;color:var(--leise);font-variant-numeric:tabular-nums}
.g-frage{font:italic 600 1.875rem/1.25 var(--font-stimme);color:var(--text)}
.g-zitat{font:italic 600 1.375rem/1.4 var(--font-stimme)}
.g-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.g :focus-visible{outline:3px solid var(--text);outline-offset:2px;box-shadow:var(--fokus-innen)}

/* ---------- Bewegung: nur wenn erlaubt ---------- */
@media (prefers-reduced-motion:no-preference){
  :root:not([data-bewegung=weniger]) .g-knopf{transition:transform var(--dauer-druck) var(--kurve-aus),box-shadow var(--dauer-schnell) var(--kurve-aus)}
  :root:not([data-bewegung=weniger]) .g-karte{transition:transform var(--dauer-schnell) var(--kurve-aus),box-shadow var(--dauer-schnell) var(--kurve-aus)}
  :root:not([data-bewegung=weniger]) .g-option span,:root:not([data-bewegung=weniger]) .g-punkt{transition:background-color var(--dauer-schnell) var(--kurve-aus),border-color var(--dauer-schnell) var(--kurve-aus),transform var(--dauer-langsam) var(--kurve-feder,var(--kurve-aus))}
  :root:not([data-bewegung=weniger]) .g-wende__innen{transition:transform var(--dauer-wende) var(--kurve-beidseits)}
  :root:not([data-bewegung=weniger]) .g-mark{transition:background-size 260ms var(--kurve-aus)}
  :root:not([data-bewegung=weniger]) .g-balken__wert{transition:transform var(--dauer-reihe) var(--kurve-aus)}
  :root:not([data-bewegung=weniger]) .g-hilfe__stufe{transition:opacity var(--dauer-mittel) var(--kurve-aus),transform var(--dauer-mittel) var(--kurve-aus)}
}

/* ---------- Knopf ---------- */
.g-knopf{display:inline-flex;align-items:center;gap:10px;min-height:var(--knopf-hoehe);padding:12px 20px;border-radius:var(--radius-sm);border:2px solid var(--text);font:700 1.0625rem/1.2 var(--font-text);cursor:pointer;text-decoration:none;touch-action:manipulation}
.g-knopf--primaer{background:var(--text);color:var(--grund)}
.g-knopf--sekundaer{background:var(--flaeche);color:var(--text);border-color:var(--stahl)}
.g-knopf--hell{background:var(--flaeche);color:var(--text);border-color:var(--flaeche)}
.g-knopf--still{background:transparent;color:var(--text);border-color:transparent;min-height:44px;padding:8px 14px;font-size:1rem;text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:2px}
.g-knopf:active{transform:translate(2px,2px)}
.g-knopf[disabled]{opacity:.55;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){.g-knopf:not([disabled]):hover{box-shadow:var(--platte-knopf)}}

/* ---------- Etikett ---------- */
.g-etikett{justify-self:start;width:fit-content;display:inline-flex;align-items:center;gap:6px;font:700 1rem/1.3 var(--font-text);padding:2px 8px;border-radius:var(--radius-sm)}
.g-etikett--ki{background:var(--honigplatte);color:var(--auf-honig);box-shadow:inset 0 0 0 2px var(--honig)}
.g-etikett--lernen{background:var(--petrol);color:var(--auf-petrol)}
.g-etikett--beide{background:var(--ueberdruck);color:var(--auf-ueberdruck)}
.g-etikett--these{background:var(--oxid-hi);color:var(--text);box-shadow:inset 0 0 0 2px var(--oxid)}
.g-etikett--erprobt{background:var(--erfolg-hi);color:var(--text)}
.g-etikett--offen{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--stahl)}

/* ---------- Karte + Wende ---------- */
.g-karte{position:relative;background:var(--flaeche);color:var(--text);border-radius:var(--radius-sm);padding:var(--space-5);box-shadow:6px 6px 0 0 var(--platte-farbe,var(--karton));display:grid;gap:var(--space-2);align-content:start}
.g-karte--ki{--platte-farbe:var(--honigplatte)}.g-karte--lernen{--platte-farbe:var(--petrol)}.g-karte--beide{--platte-farbe:var(--ueberdruck)}
.g-karte__titel{font:600 1.375rem/1.2 var(--font-display)}
.g-karte__titel a{color:inherit;text-decoration:none}
.g-karte__titel a::after{content:"";position:absolute;inset:0}
@media (hover:hover) and (pointer:fine){.g-karte:has(a):hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 0 var(--platte-farbe,var(--karton))}}
.g-karte:has(a):active{transform:translate(4px,4px);box-shadow:2px 2px 0 0 var(--platte-farbe,var(--karton))}
.g-karte:focus-within{outline:3px solid var(--text);outline-offset:2px}

.g-wende{perspective:1200px}
.g-wende__innen{display:grid;gap:var(--space-4)}
.g-wende__seite{background:var(--flaeche);border-radius:var(--radius-sm);padding:var(--space-5);box-shadow:var(--platte);display:grid;gap:var(--space-3);align-content:start}
.g-wende__seite--hinten{background:var(--petrol-hi)}
.g-ist-js .g-wende__innen{display:grid;grid-template-areas:"s";transform-style:preserve-3d}
.g-ist-js .g-wende__seite{grid-area:s;backface-visibility:hidden}
.g-ist-js .g-wende__seite--hinten{transform:rotateY(180deg)}
.g-ist-js .g-wende[data-gewendet] .g-wende__innen{transform:rotateY(180deg)}
.g-wende__knopf{justify-self:start}

/* ---------- Kasten (Auftrag, Info, Hilfe) ---------- */
.g-kasten{border-radius:var(--radius-md);padding:var(--space-5);display:grid;gap:var(--space-3)}
.g-kasten__kopf{font:700 1rem/1.3 var(--font-text);display:flex;gap:8px;align-items:center}
.g-kasten--auftrag{background:var(--text);color:var(--grund)}
.g-kasten--info{background:var(--flaeche);border:2px dashed var(--stahl)}
.g-kasten--hilfe{background:var(--honig-hi)}
.g-hilfe__stufe{background:var(--flaeche);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4)}
.g-hilfe__stufe[hidden]{display:none}
.g-hilfe__stufe.g-neu{opacity:0;transform:translateY(6px)}

/* ---------- Wahl: Denken vor Klicken ---------- */
.g-wahl{display:grid;gap:var(--space-4)}
.g-wahl fieldset{border:0;margin:0;padding:0;display:grid;gap:var(--space-2)}
.g-wahl legend{padding:0;margin-bottom:var(--space-3)}
.g-option{position:relative;display:block}
.g-option input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.g-option span{display:grid;gap:4px;min-height:var(--tablet-ziel);padding:12px 16px 12px 52px;border:2px solid var(--stahl);border-radius:var(--radius-md);background:var(--flaeche);position:relative}
.g-option span::before{content:"";position:absolute;left:16px;top:16px;width:22px;height:22px;border:2px solid var(--stahl);border-radius:999px;background:var(--flaeche)}
.g-option input:checked+span{border-color:var(--kuli);box-shadow:inset 0 0 0 1px var(--kuli)}
.g-option input:checked+span::before{border-color:var(--kuli);background:radial-gradient(circle,var(--kuli) 0 5px,transparent 6px)}
.g-option input:focus-visible+span{outline:3px solid var(--text);outline-offset:2px}
.g-option__urteil{display:none;font-weight:700}
.g-wahl[data-zu] .g-option span{padding-left:58px}
.g-wahl[data-zu] .g-option span::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:var(--radius-md) 0 0 var(--radius-md);background:var(--stahl)}
.g-wahl[data-zu] .g-option[data-urteil=zentral] span::after{background:var(--erfolg)}
.g-wahl[data-zu] .g-option[data-urteil=begruendbar] span::after{background:var(--warnung)}
.g-wahl[data-zu] .g-option[data-urteil=kaum] span::after{background:var(--fehler)}
.g-wahl[data-zu] .g-option__urteil{display:block}
.g-wahl[data-zu] .g-option[data-urteil=zentral] .g-option__urteil{color:var(--erfolg)}
.g-wahl[data-zu] .g-option[data-urteil=begruendbar] .g-option__urteil{color:var(--warnung)}
.g-wahl[data-zu] .g-option[data-urteil=kaum] .g-option__urteil{color:var(--fehler)}
.g-wahl textarea{font:400 1.0625rem/1.4 var(--font-text);min-height:72px;padding:10px 14px;border:2px solid var(--stahl);border-radius:var(--radius-sm);background:var(--flaeche);color:var(--kuli);width:100%;resize:vertical}
.g-wahl__fuss{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}

/* ---------- Stempel / Siegel ---------- */
.g-stempel{display:inline-grid;place-items:center;width:112px;height:112px;border-radius:999px;border:3px solid var(--oxid);color:var(--oxid);font:700 .95rem/1.1 var(--font-text);text-align:center;transform:rotate(-8deg);padding:10px;background:var(--grund)}
.g-stempel[hidden]{display:none}

/* ---------- Skala ---------- */
.g-skala{display:grid;gap:var(--space-3)}
.g-skala__spur{position:relative;padding-block:10px}
.g-skala input[type=range]{width:100%;accent-color:var(--kuli);height:32px;margin:0}
.g-skala__enden{display:flex;justify-content:space-between;font-size:1rem;color:var(--leise)}
.g-skala__wert{font:700 1.0625rem/1.2 var(--font-text);color:var(--kuli);font-variant-numeric:tabular-nums}
.g-skala__ref{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--oxid);border-radius:2px}
.g-skala__ref[hidden]{display:none}
.g-skala__ref-text{color:var(--oxid);font-weight:700}

/* ---------- Schwärzung / Aufdecken ---------- */
.g-schwarz{position:relative}
.g-ist-js .g-aufdecken:not([data-offen]) .g-schwarz{color:transparent;user-select:none}
.g-ist-js .g-schwarz::after{content:"";position:absolute;left:-2px;right:-2px;top:.12em;bottom:.06em;background:var(--text);transform-origin:right center;pointer-events:none}
.g-ist-js .g-aufdecken[data-offen] .g-schwarz::after{transform:scaleX(0)}
@media (prefers-reduced-motion:no-preference){
  :root:not([data-bewegung=weniger]) .g-ist-js .g-schwarz::after{transition:transform var(--dauer-aufdecken) var(--kurve-aus);transition-delay:calc(var(--i,0) * 70ms)}
  :root:not([data-bewegung=weniger]) .g-ist-js .g-schwarz{transition:color 1ms linear;transition-delay:calc(var(--i,0) * 70ms + 200ms)}
}

/* ---------- Markieren ---------- */
.g-stifte{display:flex;gap:var(--space-2);flex-wrap:wrap}
.g-stift{min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--stahl);background:var(--flaeche);color:var(--text);font:700 1rem/1.2 var(--font-text);cursor:pointer}
.g-stift[aria-pressed=true]{background:var(--text);color:var(--grund);border-color:var(--text)}
.g-wort{cursor:pointer;border-radius:2px}
.g-mark{background-repeat:no-repeat;background-size:0 100%;background-position:0 0}
.g-mark--beleg{background-image:linear-gradient(var(--marker),var(--marker));background-size:100% 100%;text-decoration:underline 3px var(--honig);text-underline-offset:.18em}
.g-mark--gedanke{color:var(--kuli);text-decoration:underline 3px dotted var(--kuli);text-underline-offset:.22em}
.g-mark--beleg::before{content:"▲ ";font-size:.7em;vertical-align:.15em}
.g-mark--gedanke::before{content:"● ";font-size:.7em;vertical-align:.15em}

/* ---------- Fortschritt (Stanzloch) ---------- */
.g-fortschritt{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.g-punkte{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.g-punkt{width:18px;height:18px;border-radius:999px;border:2px solid var(--stahl);background:var(--flaeche)}
.g-punkt[data-stand=fertig]{background:var(--petrol);border-color:var(--petrol)}
.g-punkt[data-stand=jetzt]{background:var(--oxid);border-color:var(--oxid);transform:scale(1.25)}

/* ---------- Zeitleiste ---------- */
.g-zeit{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--space-2);list-style:none;margin:0;padding:28px 0 0}
.g-zeit::before{content:"";position:absolute;left:0;right:0;top:36px;height:3px;background:var(--text)}
.g-zeit li{position:relative;display:grid;gap:6px;justify-items:start}
.g-zeit button{all:unset;cursor:pointer;display:grid;gap:4px;padding-top:24px;position:relative}
.g-zeit button::before{content:"";position:absolute;top:0;left:0;width:18px;height:18px;border-radius:999px;background:var(--flaeche);border:3px solid var(--text)}
.g-zeit li[data-offen] button::before{border-style:dashed;border-color:var(--stahl)}
.g-zeit li[data-offen] .g-zeit__jahr{color:var(--leise)}
.g-zeit__jahr{font:700 1.0625rem/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.g-zeit__text{font-size:1rem}
.g-zeit button:focus-visible{outline:3px solid var(--text);outline-offset:4px}
.g-zeit__hier{position:absolute;top:0;left:0;font:700 .95rem/1 var(--font-text);background:var(--oxid);color:var(--grund);padding:4px 8px;border-radius:var(--radius-sm);white-space:nowrap}

/* ---------- Balken ---------- */
.g-balken{display:grid;gap:var(--space-3)}
.g-balken__zeile{display:grid;grid-template-columns:minmax(6rem,9rem) 1fr 4.75rem;gap:var(--space-3);align-items:center}
.g-balken__spur{height:22px;background:var(--karton);border-radius:var(--radius-sm);overflow:hidden}
.g-balken__wert{display:block;height:100%;width:calc(var(--w) * 1%);background:var(--farbe,var(--petrol));transform-origin:left center}
.g-balken__zahl{white-space:nowrap;font:700 1.0625rem/1 var(--font-text);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- Platten (Registrieren) ---------- */
.g-platten{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:16px auto 16px}
.g-platte{padding:var(--space-5);display:grid;gap:var(--space-2);align-content:start}
.g-platte h3{font-size:1.5rem}
.g-platte--ki{grid-column:1/8;grid-row:1/3;background:var(--honigplatte);color:var(--auf-honig);box-shadow:inset 0 0 0 2px var(--honig);padding-right:calc(2/7*100% + 16px)}
.g-platte--lernen{grid-column:6/13;grid-row:2/4;background:var(--petrol);color:var(--auf-petrol);padding-left:calc(2/7*100% + 16px)}
.g-schnitt{grid-column:6/8;grid-row:2/3;z-index:1;background:var(--ueberdruck);color:var(--auf-ueberdruck);padding:var(--space-4);display:flex;align-items:flex-end;font-weight:700;line-height:1.25}
@media (max-width:600px){.g-platten{grid-template-columns:1fr;grid-template-rows:auto}.g-platte--ki,.g-platte--lernen,.g-schnitt{grid-column:1;grid-row:auto;padding:var(--space-5)}}

/* ---------- Bewegungsschalter ---------- */
.g-schalter{display:inline-flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-weight:700}
.g-schalter input{appearance:none;width:52px;height:30px;border-radius:999px;border:2px solid var(--stahl);background:var(--flaeche);position:relative;margin:0;cursor:pointer}
.g-schalter input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:var(--stahl)}
.g-schalter input:checked{background:var(--text);border-color:var(--text)}
.g-schalter input:checked::after{left:25px;background:var(--grund)}

/* ---------- Musterbuch ---------- */
.g-muster{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--space-4)}
.g-muster__feld{background:var(--flaeche);border-radius:var(--radius-sm);padding:var(--space-4);display:grid;gap:var(--space-3);align-content:start}

.k-klassenbild{background:var(--grund);border:2px solid var(--text);border-radius:var(--radius-md);padding:var(--space-5);display:grid;gap:var(--space-3)}
.k-klassenbild>*{margin:0}
.k-kb-zeile{display:grid;grid-template-columns:minmax(8rem,14rem) auto 1fr;gap:var(--space-3);align-items:center}
.k-kb-zahl{display:flex;align-items:center;gap:6px}
.k-kb-zahl button{width:44px;height:44px;border:2px solid var(--stahl);border-radius:var(--radius-sm);background:var(--flaeche);font:700 1.25rem/1 var(--font-text);cursor:pointer}
.k-kb-zahl output{min-width:2.2ch;text-align:center;font:700 1.4rem/1 var(--font-display)}
.k-kb-balken{height:28px;background:var(--karton);border-radius:var(--radius-sm);position:relative;overflow:hidden}
.k-kb-balken i{position:absolute;inset:0 auto 0 0;background:var(--petrol);border-radius:var(--radius-sm)}
:root:not([data-bewegung=weniger]) .k-kb-balken i{transition:width var(--dauer-mittel) var(--kurve-aus)}
@media (max-width:640px){.k-kb-zeile{grid-template-columns:1fr auto}.k-kb-balken{grid-column:1/-1}}

/* Selbsttest (Skala) */
.k-test{display:grid;gap:6px;margin:0;padding:0;border:0}
.k-item{display:grid;grid-template-columns:1fr auto;gap:var(--space-3);align-items:center;padding:8px 12px;background:var(--grund);border-radius:var(--radius-sm);border:0;margin:0;min-width:0}
.k-item legend{float:left;padding:0;width:100%;font-size:1.04rem}
.k-item.k-offen{box-shadow:inset 6px 0 0 var(--honigplatte)}
.k-stufen{display:flex;gap:6px;flex-wrap:wrap}
.k-stufen label{position:relative;display:block}
.k-stufen input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.k-stufen span{display:grid;place-items:center;min-width:44px;min-height:44px;padding:0 10px;border:2px solid var(--stahl);border-radius:var(--radius-sm);background:var(--flaeche);font-weight:700;font-size:1rem}
.k-stufen input:checked+span{background:var(--kuli);border-color:var(--kuli);color:var(--flaeche)}
.k-stufen input:focus-visible+span{outline:3px solid var(--text);outline-offset:2px}
.k-legende{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:1rem;color:var(--leise);margin:0}
@media (max-width:700px){.k-item{grid-template-columns:1fr}}
.k-balken{display:grid;gap:var(--space-3);max-width:var(--zeilenlaenge)}
.k-balken>div{display:grid;grid-template-columns:minmax(9rem,13rem) 1fr;gap:var(--space-3);align-items:center}
.k-balken b{font-weight:700}
.k-balken span{display:block;height:26px;background:var(--karton);border-radius:var(--radius-sm);position:relative;overflow:hidden}
.k-balken span i{position:absolute;inset:0 auto 0 0;background:var(--kuli);border-radius:var(--radius-sm)}
.k-balken small{grid-column:2;font-size:1rem;color:var(--leise)}
@media (max-width:640px){.k-balken>div{grid-template-columns:1fr}.k-balken small{grid-column:1}}

/* Sortieren und Verorten */
.k-stapel{display:flex;flex-wrap:wrap;gap:var(--space-2);min-height:60px;padding:var(--space-3);background:var(--karton);border-radius:var(--radius-sm)}
.k-chip{-webkit-appearance:none;appearance:none;font:700 1.02rem/1.25 var(--font-text);min-height:var(--chip-hoehe);padding:8px 14px;background:var(--flaeche);color:var(--text);border:2px solid var(--stahl);border-radius:var(--radius-sm);cursor:pointer;touch-action:manipulation;text-align:left;max-width:100%}
.k-chip--satz{font-weight:400;line-height:1.35}
.k-chip[aria-pressed="true"]{border-color:var(--kuli);background:var(--kuli);color:var(--flaeche)}
.k-chip[data-urteil="kaum"]{border-color:var(--fehler);border-style:dashed}
.k-chip[data-urteil="zentral"]{border-color:var(--erfolg)}
.k-chip[data-urteil="begruendbar"]{border-color:var(--warnung)}
.k-chip--alt{font-weight:400;color:var(--leise);border-style:dotted;cursor:default}
.k-faecher{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
.k-faecher--drei{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.k-faecher--drei{grid-template-columns:1fr}}
.k-fach{background:var(--grund);border:2px solid var(--stahl);border-radius:var(--radius-md);padding:var(--space-4);display:grid;gap:var(--space-2);align-content:start}
.k-fach>*{margin:0}
.k-fach h4{font-size:1.1rem}
.k-fach p{font-size:1rem;color:var(--leise)}
.k-fach__liegt{display:flex;flex-wrap:wrap;gap:var(--space-2);min-height:44px}
.k-fach .g-knopf{justify-self:start}
.k-rueck{padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);max-width:var(--zeilenlaenge);margin:0}
.k-rueck ul{margin:6px 0 0}
.k-rueck--gut{background:var(--erfolg-hi);box-shadow:inset 6px 0 0 var(--erfolg)}
.k-rueck--weiter{background:var(--warnung-hi);box-shadow:inset 6px 0 0 var(--warnung)}
.k-rueck--kaum{background:var(--fehler-hi);box-shadow:inset 6px 0 0 var(--fehler)}

/* Raster mit Zeilen und Spalten (z. B. Attribution) */
.k-raster{display:grid;gap:6px;grid-template-columns:minmax(7rem,10rem) repeat(var(--spalten,4),minmax(0,1fr))}
.k-raster__kopf{font:700 1rem/1.25 var(--font-text);padding:8px;background:var(--karton);border-radius:var(--radius-sm);display:grid;align-content:center}
.k-raster .k-fach{padding:10px;border-width:2px}
.k-raster .k-fach .g-knopf{min-height:44px;padding:6px 10px;font-size:1rem}
/* Das Raster bleibt ein Raster, solange das Blatt breit genug ist (auch am iPad hochkant). Erst darunter eine Spalte – dann trägt jedes Feld seine Spalte als Beschriftung. */
.k-raster__ort{display:none;margin:0 0 6px;font-weight:700;font-size:1rem}
@container blatt (max-width:40rem){.k-raster{grid-template-columns:1fr}.k-raster__kopf--leer,.k-raster__kopf--spalte{display:none}.k-raster__ort{display:block}}

/* ---------- Motivationskreis ---------- */
.k-kreis{display:grid;grid-template-columns:34px minmax(0,1fr) 40px minmax(0,1fr);grid-template-areas:"s1 ich . umgebung" "s2 pf1 . pf2" "s3 erwartung mal wert" "s4 pf3 pf3 pf3" "s5 handeln handeln handeln" "s6 pf4 pf4 pf4" "s7 ergebnis ergebnis ergebnis" "s8 pf5 pf5 pf5" "s9 erklaerung erklaerung erklaerung";gap:0 var(--space-2);position:relative}
.k-kreis__schiene{grid-column:1;grid-row:1/10;position:relative}
.k-kreis__schiene::before{content:"";position:absolute;left:12px;top:30px;bottom:30px;border-left:3px solid var(--honig)}
.k-kreis__schiene::after{content:"";position:absolute;left:12px;right:-8px;top:30px;border-top:3px solid var(--honig)}
.k-kreis__schiene i{position:absolute;left:12px;right:-8px;bottom:30px;border-top:3px solid var(--honig)}
.k-kreis__schiene b{position:absolute;right:-12px;top:23px;width:0;height:0;border-left:12px solid var(--honig);border-top:8px solid transparent;border-bottom:8px solid transparent}
.k-kreis__schiene span{position:absolute;left:13px;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-size:1rem;font-weight:700;color:var(--honig);background:var(--flaeche);padding:0 6px}
.k-station{border:2px solid var(--text);border-radius:var(--radius-sm);background:var(--grund);padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.k-station>*{margin:0}
.k-station h4{font-size:1.15rem;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.k-station h4 small{font:italic 600 1rem/1.3 var(--font-stimme);color:var(--leise)}
.k-station__liegt{display:flex;flex-wrap:wrap;gap:6px;min-height:8px}
.k-station .g-knopf{justify-self:start;min-height:44px;padding:6px 12px;font-size:1rem}
.k-station[data-ziel="ja"]{border-color:var(--kuli);box-shadow:4px 4px 0 0 var(--kuli)}
.k-pfeil{display:grid;place-items:center;height:30px;color:var(--text);font:700 1.2rem/1 var(--font-text)}
.k-mal{grid-area:mal;display:grid;place-items:center}
.k-mal span{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--text);color:var(--grund);font:700 1.3rem/1 var(--font-display)}
.k-kreis .k-chip{font-size:1rem;min-height:44px;padding:6px 10px}
/* Nur zum Ansehen (frühere Begriffe, Bilder, Übersicht): kleiner, nicht antippbar */
.k-kreis span.k-chip{min-height:36px}
.k-kreis--klein .k-station{padding:10px}
@media (max-width:700px){
  .k-kreis{grid-template-columns:28px minmax(0,1fr);grid-template-areas:"s1 ich" "s1b umgebung" "s2 pf1" "s3 erwartung" "s3b mal" "s3c wert" "s4 pf3" "s5 handeln" "s6 pf4" "s7 ergebnis" "s8 pf5" "s9 erklaerung"}
  .k-kreis__schiene{grid-row:1/13}
  .k-pf2{display:none}
}
.k-kreis-legende{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:1rem;color:var(--leise);margin:0}

/* ---------- Landkarte der Einheit ---------- */
.k-landkarte{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:8px;max-width:none}
.k-landkarte li{margin:0}
.k-landkarte a,.k-landkarte span.k-lk{display:grid;gap:2px;height:100%;min-height:84px;padding:10px 12px;border:2px solid var(--linie);border-radius:var(--radius-sm);text-decoration:none;background:var(--grund)}
.k-landkarte b{font:600 1.05rem/1.2 var(--font-display)}
.k-landkarte small{font-size:1rem;color:var(--leise);line-height:1.3}
.k-landkarte .k-lk-hier a,.k-landkarte .k-lk-hier span.k-lk{border-color:var(--text);background:var(--honig-hi);box-shadow:4px 4px 0 0 var(--honigplatte)}
.k-landkarte .k-lk-hier small:last-child{color:var(--oxid);font-weight:700}
.k-landkarte .k-lk-ka span.k-lk{border-style:dashed;border-color:var(--stahl)}

/* Schreiben (wie in der Klassenarbeit) */
.k-zugang{display:flex;gap:8px;flex-wrap:wrap}
.k-zugang button{min-height:44px;padding:6px 14px;border:2px solid var(--stahl);border-radius:var(--radius-sm);background:var(--flaeche);font-weight:700;font-size:1rem;cursor:pointer}
.k-zugang button[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--grund)}
.k-kriterien{width:100%;border-collapse:collapse;font-size:1.02rem}
.k-kriterien th,.k-kriterien td{text-align:left;vertical-align:top;padding:10px 12px;border:2px solid var(--linie)}
.k-kriterien th{width:9rem;font-family:var(--font-display)}
.k-kriterien td:last-child{width:11rem}
details.k-hilfe{background:var(--honig-hi);border-radius:var(--radius-md);padding:var(--space-2) var(--space-4);max-width:var(--zeilenlaenge)}
details.k-hilfe summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
details.k-hilfe>*:last-child{margin-bottom:var(--space-3)}
.k-kann{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:none}
.k-kann li{display:grid;grid-template-columns:1fr auto;gap:var(--space-3);align-items:center;background:var(--grund);padding:8px 12px;border-radius:var(--radius-sm);margin:0}
@media (max-width:700px){.k-kann li{grid-template-columns:1fr}}
.k-regler{display:grid;gap:var(--space-3);background:var(--grund);border:2px solid var(--text);border-radius:var(--radius-md);padding:var(--space-5)}
.k-regler>*{margin:0}
.k-regler label{display:grid;gap:6px;font-weight:700}
.k-regler input[type=range]{width:100%;min-height:44px;accent-color:var(--text)}
.k-regler output{font:700 1.3rem/1 var(--font-display)}

/* ---------- Fuß der Seite, Löschen ---------- */
.k-loeschen{background:var(--fehler-hi);padding:var(--space-4);border-radius:var(--radius-md);display:grid;gap:var(--space-3)}
.k-loeschen>*{margin:0}
.k-urheber{font-size:1rem;color:var(--leise);margin:0}

/* ---------- Schmale Bildschirme: Register als Leiste ---------- */
@media (max-width:980px){
  .k-rahmen{grid-template-columns:1fr}
  .k-register{position:sticky;top:64px;z-index:30;height:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;padding:8px 10px;border-right:0;border-bottom:2px solid var(--linie)}
  .k-register__kopf,.k-register__fuss{display:none}
  .k-register ol{display:flex;gap:6px}
  .k-reg{grid-template-columns:34px auto;min-height:48px;padding:5px 8px;white-space:nowrap}
  .k-reg__nr{width:34px;height:34px;font-size:1rem}
  .k-reg__text small,.k-reg__stand{display:none}
  .k-reg__text b{font-size:1rem}
  .k-unten{display:block!important}
}
.k-unten{display:none;margin-top:var(--space-6)}
.k-unten .k-register__fuss{display:grid;border-top:2px solid var(--linie)}
@media (max-width:600px){.k-kopf nav .k-kopflink:not(.k-kopflink--haupt){display:none}}

/* ---------- Druck: Lernmappe ---------- */
.k-druck{display:none}
@media print{
  @page{size:A4;margin:13mm 14mm}
  html,body{background:#fff!important;color:#000!important}
  body{font-size:10.2pt;line-height:1.36}
  .k-kopf,.k-rahmen,.k-stimmkarte,.k-unten,.h-seite,noscript{display:none!important}
  .k-druck{display:block}
  .k-druck h1{font-size:18pt;margin:0 0 5pt}
  .k-druck h2{font-size:12.5pt;margin:9pt 0 4pt}
  .k-druck h3{font-size:11pt;margin:7pt 0 3pt}
  .k-druck p,.k-druck li{margin:0 0 3pt;max-width:none}
  .k-druck ul,.k-druck ol{max-width:none;margin:0 0 5pt}
  .k-druck .d-seite{break-after:page;page-break-after:always}
  .k-druck .d-seite:last-child{break-after:auto;page-break-after:auto}
  .k-druck table{width:100%;border-collapse:collapse;margin:0 0 6pt;font-size:9.6pt}
  .k-druck th,.k-druck td{border:.8pt solid #777;padding:2.5pt 4pt;text-align:left;vertical-align:top}
  .k-druck .d-meta{font-size:8.6pt;color:#333;margin:0 0 4pt}
  .k-druck .d-kasten{border:1.1pt solid #000;padding:5pt 7pt;margin:0 0 6pt}
  .k-druck .d-dein{border-left:2.5pt solid #1e4fb5;padding-left:5pt;white-space:pre-wrap;min-height:11pt;margin:0 0 4pt}
  .k-druck .d-linie{border-bottom:.8pt solid #777;height:15pt}
  .k-druck .d-kreis{display:grid;grid-template-columns:1fr 1fr;gap:3pt;font-size:9pt;margin:0 0 6pt}
  .k-druck .d-kreis div{border:.8pt solid #444;padding:3pt 4pt}
  .k-druck .d-kreis div.d-breit{grid-column:1/-1}
  .k-druck .d-kreis b{display:block;font-size:9.4pt}
}
/* Wahl: Leiste links zeigt nach dem Festlegen die Stufe (Text trägt die Bedeutung) */
.k-wahl[data-zu] .g-option>span{padding-left:58px}
.k-wahl[data-zu] .g-option>span::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:var(--radius-md) 0 0 var(--radius-md);background:var(--stahl)}
.k-wahl[data-zu] .g-option[data-urteil=zentral]>span::after{background:var(--erfolg)}
.k-wahl[data-zu] .g-option[data-urteil=begruendbar]>span::after{background:var(--warnung)}
.k-wahl[data-zu] .g-option[data-urteil=kaum]>span::after{background:var(--fehler)}
/* Ampel-Raster */
.k-kriterien--ampel td:last-child{width:auto;min-width:16rem}
.k-ampel span{min-width:0;padding:0 10px}
.k-ampel input:checked+span[data-ampel="0"]{background:var(--fehler);border-color:var(--fehler);color:var(--flaeche)}
.k-ampel input:checked+span[data-ampel="1"]{background:var(--warnung);border-color:var(--warnung);color:var(--flaeche)}
.k-ampel input:checked+span[data-ampel="2"]{background:var(--erfolg);border-color:var(--erfolg);color:var(--flaeche)}
@media (max-width:700px){.k-kriterien,.k-kriterien tbody,.k-kriterien tr,.k-kriterien th,.k-kriterien td{display:block;width:auto!important}.k-kriterien th{border-bottom:0}.k-kriterien td{border-top:0}}
/* Schaubilder: Farben aus den Tokens, damit hell, dunkel und Beamer stimmen */
.k-svg{width:100%;height:auto;display:block;overflow:visible}
.k-svg text{fill:var(--text);font:600 17px/1 var(--font-text)}
.k-svg .t-leise{fill:var(--leise);font-weight:400}
.k-svg .t-gross{font:700 21px/1 var(--font-display)}
.k-svg .t-klein{font-size:16px}
.k-svg .t-18{font-size:18px}
.k-svg .t-20{font-size:20px}
.k-svg .l-text{stroke:var(--text);fill:none;stroke-width:2}
.k-svg .l-leise{stroke:var(--stahl);fill:none;stroke-width:2}
.k-svg .l-linie{stroke:var(--linie);fill:none;stroke-width:1.5}
.k-svg .f-flaeche{fill:var(--flaeche);stroke:var(--text);stroke-width:2}
.k-svg .f-honig{fill:var(--honigplatte);stroke:var(--text);stroke-width:2}
.k-svg .f-honig-hi{fill:var(--honig-hi);stroke:none}
.k-svg .f-petrol{fill:var(--petrol);stroke:none}
.k-svg .f-petrol-hi{fill:var(--petrol-hi);stroke:none}
.k-svg .f-kuli{fill:var(--kuli);stroke:none}
.k-svg .f-oxid{fill:var(--oxid);stroke:none}
.k-svg .l-kuli{stroke:var(--kuli);fill:none;stroke-width:3}
.k-svg .l-oxid{stroke:var(--oxid);fill:none;stroke-width:3}
.k-svg .f-text{fill:var(--text);stroke:none}
.k-svg .f-wasser{fill:var(--petrol-hi);stroke:var(--petrol);stroke-width:2}
/* Werkbank: Regler mit sichtbarer Folge */
.k-werkbank{display:grid;gap:var(--space-4);background:var(--grund);border:2px solid var(--text);border-radius:var(--radius-md);padding:var(--space-5)}
.k-werkbank>*{margin:0}
.k-werkbank__regler{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
.k-werkbank label{display:grid;gap:6px;font-weight:700}
.k-werkbank input[type=range]{width:100%;min-height:44px;accent-color:var(--text)}
.k-werkbank output{font:700 1.25rem/1 var(--font-display)}
.k-schalter-zwei{display:flex;gap:8px;flex-wrap:wrap}
.k-schalter-zwei button{min-height:44px;padding:6px 14px;border:2px solid var(--stahl);border-radius:var(--radius-sm);background:var(--flaeche);font-weight:700;font-size:1rem;cursor:pointer}
.k-schalter-zwei button[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--grund)}
/* Protokoll (Zielspiel) */
.k-protokoll{display:grid;gap:var(--space-3)}
.k-wurf{display:grid;grid-template-columns:7rem 1fr;gap:var(--space-3);align-items:center;padding:var(--space-3);background:var(--grund);border-radius:var(--radius-sm);border:2px solid var(--linie)}
.k-wurf[data-aktiv]{border-color:var(--text)}
.k-wurf[aria-disabled="true"]{opacity:.6}
.k-wurf b{font:700 1.1rem/1.2 var(--font-display)}
.k-wurf__wahl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.k-wurf__wahl button{min-width:52px;min-height:48px;border:2px solid var(--stahl);border-radius:var(--radius-sm);background:var(--flaeche);font:700 1rem/1 var(--font-text);cursor:pointer;padding:0 10px}
.k-wurf__wahl button[aria-pressed="true"]{background:var(--kuli);border-color:var(--kuli);color:var(--flaeche)}
.k-wurf__wahl button:disabled{cursor:not-allowed}
.k-wurf__trenner{width:2px;align-self:stretch;background:var(--linie);margin:0 6px}
@media (max-width:640px){.k-wurf{grid-template-columns:1fr}}
/* Analyse einer Geschichte */
.k-analyse{display:grid;gap:var(--space-3)}
.k-analyse__zeile{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(12rem,1fr);gap:var(--space-3);align-items:center;padding:var(--space-3);background:var(--grund);border-radius:var(--radius-sm);border:2px solid var(--linie)}
.k-analyse__zeile p{margin:0;font:italic 600 1.05rem/1.4 var(--font-stimme)}
.k-analyse__zeile select{min-height:48px;border:2px solid var(--stahl);border-radius:var(--radius-sm);background:var(--flaeche);padding:0 8px;font-size:1rem;width:100%}
@media (max-width:700px){.k-analyse__zeile{grid-template-columns:1fr}}
.k-chip--bild{font:italic 600 .98rem/1.3 var(--font-stimme);border-color:var(--honig);background:var(--honig-hi);cursor:default}

/* Gegenwart – interaktive Bausteine. Ein klassisches Skript, keine Bibliothek, kein Netzwerk.

  B.wende = function (el) {
    var k = $(".g-wende__knopf", el);
    if (!k) return;
    k.hidden = false;
    $$(".g-wende__knopf", el).forEach(function (b) {

      ansagen(live, "Festgelegt. Deine Wahl: " + wort + ". " + (opt.getAttribute("data-grund") || ""));
      los.disabled = true;
    });
  };

  // Skala mit Bezugsmarke
  B.skala = function (el) {
    var r = $("input[type=range]", el), w = $(".g-skala__wert", el), ref = $(".g-skala__ref", el), k = $("[data-g-vergleichen]", el), t = $(".g-skala__ref-text", el);

          "»Motivation ist die aktuelle Ausrichtung des momentanen Lebensvollzugs auf einen als positiv bewerteten Zielzustand.« Prüfe die drei Teile: aktuell/momentan · Ausrichtung · positiv bewerteter Zielzustand."] },
        { typ: "eigen", bauen: function (c) {
          var t = (c.D.st.ds06 && c.D.st.ds06.skala && c.D.st.ds06.skala.m1) || {};
          return '<p class="k-klein">' + (Object.keys(t).length ? "Dein Selbsttest aus Stunde 1 ist auf diesem Gerät. Du brauchst ihn am Ende der Stunde." : "Dein Selbsttest aus Stunde 1 ist nicht auf diesem Gerät. Hast du ihn als Datei gesichert, lade ihn im Register unten. Sonst geht es auch ohne.") + "</p>";

      { id: "a2", nr: "2", titel: "Spur 1: Wann bleibe ich gern dran?", sozial: "allein", min: 8, oeffnet: "nach", zusatz: "Spur 1 von 3", bloecke: [
        { typ: "text", html: "<p>Deci und Ryan nehmen an: Jeder Mensch hat drei angeborene <b>Grundbedürfnisse</b>. Sind sie erfüllt, tritt intrinsische Motivation eher auf. Ihre Theorie heißt <b>Selbstbestimmungstheorie</b>. Welche drei Bedürfnisse? Folge den Spuren und stelle bei jeder eine Vermutung auf.</p>" },
        { typ: "skala", id: "kompetenz", stufen: "fuenf", items: ITEMS_A, einleitung: "Ein kurzer Selbsttest: Wie sehr trifft jeder Satz auf dich zu?" },
        { typ: "fest", id: "hypA", luecke: true, label: "Ich bin besonders häufig intrinsisch motiviert, wenn ich mich dabei … fühle.", platzhalter: "ein Wort", mind: 3, max: 60, zeilen: 1, kurz: "Meine Vermutung zu Spur 1 (ein Wort)" },
        { typ: "karten", karten: [{ art: "honig", titel: "Grundbedürfnis nach Kompetenz", html: "<p>Menschen wollen sich beim Handeln als fähig erleben. Wird das erfüllt, steigt die Wahrscheinlichkeit für intrinsische Motivation. Kompetent fühlen wir uns, wenn eine Aufgabe <b>weder zu leicht noch zu schwer</b> ist (Harter 1978). Positive Rückmeldung kann das Kompetenzerleben stärken.</p><p class=\"k-klein\">Aber: Man kann sich beim Vokabellernen kompetent fühlen, ohne intrinsisch motiviert zu sein. Kompetenz allein reicht nicht.</p>" }] },
        { typ: "wahl", items: W_A }
      ] },
      { id: "a3", nr: "3", titel: "Spur 2: Puzzeln für Geld", sozial: "allein", min: 9, oeffnet: "nach", zusatz: "Spur 2 von 3", bloecke: [
        { typ: "befund", status: "belegte Quelle · vereinfacht", quelle: "Deci (1971), Journal of Personality and Social Psychology 18", html: "<p><b>Ein Experiment:</b> Studierende lösen an drei Terminen knifflige Legepuzzles. Am zweiten Termin bekommt eine Gruppe für jedes gelöste Puzzle Geld, die andere nicht. Am dritten Termin gibt es für niemanden Geld. Zwischendurch verlässt der Versuchsleiter jeweils für einige Minuten den Raum. Die Personen dürfen tun, was sie wollen: weiterpuzzeln, Zeitschriften lesen, nichts tun.</p>" },
        { typ: "wahl", items: W_B1 },
        { typ: "befund", status: "belegte Quelle · vereinfacht", html: "<p><b>Befund:</b> Die Gruppe, die Geld bekommen hatte, beschäftigte sich am dritten Termin in der freien Zeit <b>weniger</b> mit den Puzzles als vorher. Die andere Gruppe nicht. Das nennt man <b>Unterminierungseffekt</b>: Eine Belohnung von außen kann die Freude an einer Tätigkeit untergraben.</p>" },
        { typ: "fest", id: "hypB", luecke: true, label: "Die Belohnung hat den Personen das Gefühl genommen, … zu sein.", platzhalter: "ein Wort", mind: 3, max: 60, zeilen: 1, kurz: "Meine Vermutung zu Spur 2 (ein Wort)" },
        { typ: "karten", karten: [{ art: "honig", titel: "Grundbedürfnis nach Selbstbestimmung", html: "<p>Menschen wollen erleben, dass sie selbst entscheiden, was sie tun – man spricht auch von Autonomie. Kommt eine Belohnung dazu, verschiebt sich der Grund nach außen: »Ich tue es fürs Geld«. Je mehr wir eine Handlung als frei gewählt erleben, desto wahrscheinlicher ist intrinsische Motivation.</p>" }] },
        { typ: "kasten", art: "info", titel: "Wann der Effekt auftritt", html: "<p>Eine Auswertung von 128 Experimenten zeigt: Untergraben wird die Freude vor allem durch <b>erwartete, greifbare</b> Belohnungen (Geld, Preise), die man <b>für das Tun</b> bekommt. Ehrliches Lob stärkt die Motivation eher. Eine Überraschung danach schadet kaum (Deci, Koestner &amp; Ryan 1999). Wie stark der Effekt ist, wird bis heute diskutiert.</p>" },
        { typ: "wahl", items: W_B2 }
      ] },
      { id: "a4", nr: "4", titel: "Spur 3: Was andere mit mir zu tun haben", sozial: "allein", min: 8, oeffnet: "nach", zusatz: "Spur 3 von 3", bloecke: [
        { typ: "befund", status: "belegte Quelle · zusammengefasst", quelle: "nach Wigfield u. a. (2006) und Jerusalem & Schwarzer (1991), aus dem Unterrichtsmaterial M4", html: "<ul><li>Kinder, die in ihrer Gruppe beliebt sind, haben höhere Motivationswerte als wenig beliebte Kinder.</li><li>Kooperatives Lernen hat meist positive Wirkungen auf die Lern- und Leistungsmotivation.</li><li>Jugendliche halten Aktivitäten mit Gleichaltrigen für besonders wichtig.</li><li>In Klassen mit schlechtem Klima zeigten Lernende mehr Hilflosigkeit und Angst und weniger Selbstwertgefühl als in Klassen mit gutem Klima.</li></ul>" },
        { typ: "fest", id: "hypC", luecke: true, label: "Ich bin besonders häufig intrinsisch motiviert, wenn ich mich … fühle.", platzhalter: "ein bis zwei Wörter", mind: 3, max: 60, zeilen: 1, kurz: "Meine Vermutung zu Spur 3" },
        { typ: "karten", karten: [{ art: "honig", titel: "Grundbedürfnis nach sozialer Eingebundenheit", html: "<p>Menschen wollen sich mit anderen verbunden fühlen und vertrauensvolle Beziehungen aufbauen. Das erklärt, warum Anerkennung so stark wirkt. Und es beeinflusst Interessen: Man übernimmt zum Beispiel das Hobby einer Freundin.</p>" }] },
        { typ: "text", html: "<h3>Denkwerkzeug: Zusammenhang oder Ursache?</h3>" },
        { typ: "wahl", items: W_C }
      ] },
      { id: "a5", nr: "5", titel: "Was braucht Josef?", sozial: "zu zweit", min: 8, oeffnet: "ansage", bloecke: [
        { typ: "karten", status: "ausgedachter Fall", karten: [{ art: "honig", titel: "Zur Erinnerung", html: "<p>Josef war an der Realschule gut, besonders in Mathe. Jetzt ist keine Arbeit besser als 3–4. »Ich check es ohnehin nicht.« Er ist in einer kleinen Gruppe mit Ali, Melissa und Slobodan und freut sich manchmal sogar auf die Schule. Sein Vater ist enttäuscht. Die Eltern versprechen eine Belohnung, wenn aus jeder 3–4 eine 3 wird.</p>" }] },
        { typ: "text", html: "<p>Wie gut ist jedes Bedürfnis bei Josef gerade erfüllt? Tippe an und nenne einen Beleg aus dem Fall.</p>" },

      { id: "a6", nr: "6", titel: "Vom Muss zum Wollen", sozial: "allein, dann Plenum", min: 17, oeffnet: "nach", bloecke: [
        { typ: "text", html: "<p>Zurück zur offenen Frage: Ali lernt fürs Studium – extrinsisch und trotzdem aus eigenem Antrieb? Deci und Ryan sagen: Extrinsische Motivation gibt es in vier Formen. Sie liegen auf einem <b>Kontinuum</b> zwischen fremdbestimmt und selbstbestimmt.</p>" },
        { typ: "bild", svg: kontBild(), min: 700, name: "Schaubild Kontinuum der Regulation", unterschrift: "Modell: Kontinuum der Regulation, in Anlehnung an Deci &amp; Ryan (2002)" },
        { typ: "karten", karten: [
          { art: "petrol", titel: "external", html: "<p>Ich tue es, um eine Belohnung zu bekommen oder einer Strafe zu entgehen. Der Anstoß kommt von außen.</p>" },
          { art: "petrol", titel: "introjiziert", html: "<p>Ich tue es, »weil es sich gehört« oder weil ich sonst ein schlechtes Gewissen hätte. Der Druck kommt von innen, gehört aber nicht zu mir: Antreiber und Angetriebener sind verschieden, obwohl beide in mir wohnen.</p>" },
          { art: "petrol", titel: "identifiziert", html: "<p>Ich tue es, weil ich es selbst für wichtig halte. Es kann aber noch mit anderen Zielen von mir in Konflikt stehen.</p>" },
          { art: "petrol", titel: "integriert", html: "<p>Ich tue es, weil das Ziel zu mir gehört und zu meinen anderen Zielen passt. Es bleibt Mittel zum Zweck – das unterscheidet es von intrinsisch.</p>" }
        ] },
        { typ: "text", html: "<p class=\"k-klein\">Den Weg von links nach rechts nennen Deci und Ryan <b>Internalisierung</b>: Werte und Regeln von außen werden zu eigenen. Theorie der organismischen Integration nach Deci &amp; Ryan (1993).</p><h3>Lege die Karten auf das Kontinuum</h3><p>Tippe eine Karte an, dann die Stelle, an die sie gehört. Ab fünf Karten kannst du den Zwischenstand prüfen.</p>" },
        { typ: "sortieren", id: "kontinuum", karten: KARTEN, faecher: STELLEN, satz: true, fertigText: "Lies die Karten von links nach rechts: Je weiter rechts, desto mehr gehört der Grund zu dir selbst." },
        { typ: "text", html: "<h3>Und Ali?</h3>" },
        { typ: "wahl", items: W_ALI },
        { typ: "text", html: "<h3>Warum lerne ich?</h3><p>Denk an ein Fach, für das du gerade lernst. Du musst es nicht nennen.</p>" },
        { typ: "skala", id: "regulation", stufen: "vier", stamm: "Ich lerne für dieses Fach, …", items: ITEMS_R.map(function (x) { return x[0]; }) },
        { typ: "eigen", bauen: function (c) {
          var n = c.el('<div class="k-karte k-karte--honig"><h3>Deine Gründe für dieses Fach</h3><div class="k-balken" data-x></div><p class="k-klein">Mehrere Gründe zugleich sind normal. Der Bogen ist angelehnt an Fragebögen von Ryan und Connell (1989), aber nicht geprüft und keine Diagnose. Integriert fehlt, weil es sich mit so kurzen Sätzen kaum von identifiziert trennen lässt.</p></div>');

          beispiel: "<p>»Die Geschichte hat recht, wenn sie zeigt, wie der Diener seine Freude verliert: Am Anfang arbeitet er intrinsisch motiviert, denn … Nach Deci und Ryan kommt es aber nicht darauf an, ob man mehr will, sondern …«</p>",

          muster: "<p>Die Geschichte hat recht, was den Diener betrifft: Am Anfang arbeitet er intrinsisch motiviert – er singt bei der Arbeit, obwohl ihm niemand etwas verspricht. Mit der Jagd nach der hundertsten Münze verschiebt sich sein Grund nach außen; er fühlt sich getrieben, obwohl niemand etwas von ihm verlangt (introjiziert). Nach Deci und Ryan geht ihm dabei vor allem die Selbstbestimmung verloren – darum verschwindet die Freude. Die Botschaft greift aber zu kurz: Nicht das Mehr-Wollen selbst raubt die Freude, sondern ein Ziel, das nicht zu einem gehört. Ali will viel – er will unbedingt Psychologie studieren – und lernt dafür identifiziert, also selbstbestimmt. Ich halte die Botschaft deshalb nur teilweise für richtig: Wer mehr will, verliert seine Freude vor allem dann, wenn das Ziel von außen oder durch inneren Druck gesetzt ist.</p>" },

          if (n) { var a = Object.keys(ta).reduce(function (s, i) { return s + ta[i]; }, 0) / n; html += "<p>Den Sätzen im Kompetenz-Bogen von heute hast du im Schnitt " + (a >= 3.5 ? "eher zugestimmt" : a >= 2.5 ? "teils zugestimmt" : "eher nicht zugestimmt") + ". Das hieße: Ob du dich kompetent fühlst, spielt für deine Motivation nach deinem Eindruck eine " + (a >= 3.5 ? "größere" : a >= 2.5 ? "mittlere" : "kleinere") + " Rolle. Über dein Können sagt der Bogen nichts.</p>"; }

        { typ: "fest", id: "selbst", optional: true, druck: false, label: "Welches der drei Bedürfnisse ist dir beim Lernen besonders wichtig? Begründe mit einem Beispiel. (freiwillig)", platzhalter: "Mir ist … besonders wichtig. Das merke ich zum Beispiel, wenn …", mind: 15, max: 500, kurz: "Ein Blick auf mich (freiwillig)" },
